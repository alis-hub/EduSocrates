services:
  # ─── PostgreSQL 16 ─────────────────────────────────────────────────────── #
  postgres:
    image: postgres:16-alpine
    container_name: edusocrates-postgres
    environment:
      POSTGRES_DB: edusocrates_dev
      POSTGRES_USER: edusocrates
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
      - ./database/migrations/004_sprint0_security.sql:/migrations/004_sprint0_security.sql:ro
      - ./database/docker-init/03_sprint0_security.sh:/docker-entrypoint-initdb.d/03_sprint0_security.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edusocrates -d edusocrates_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ────────────────────────────────────────────────────────────── #
  redis:
    image: redis:7-alpine
    container_name: edusocrates-redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Python FastAPI AI Gateway ──────────────────────────────────────────── #
  ai-gateway:
    build:
      context: ./services/ai-gateway
      dockerfile: Dockerfile
    container_name: edusocrates-ai-gateway
    # Internal only: the API gateway reaches it over the compose network; the browser never does.
    expose:
      - "8000"
    environment:
      ENVIRONMENT: ${APP_ENV:-development}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}
      AES_ENCRYPTION_KEY: ${AES_ENCRYPTION_KEY:?Set AES_ENCRYPTION_KEY in .env}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TEMPERATURE: "0.3"
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─── NestJS API Gateway ─────────────────────────────────────────────────── #
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: edusocrates-api-gateway
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://edusocrates:${POSTGRES_PASSWORD}@postgres:5432/edusocrates_dev
      DATABASE_APP_URL: postgresql://gurumera_app:${APP_DB_PASSWORD}@postgres:5432/edusocrates_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET (32+ random characters) in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      NODE_ENV: ${NODE_ENV:-development}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:?Set AI_GATEWAY_API_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      ENABLE_DEMO_MODE: ${ENABLE_DEMO_MODE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-no-reply@gurumera.com}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-GuruMera}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      HUB_GLOBAL_DAILY_AI_LIMIT: ${HUB_GLOBAL_DAILY_AI_LIMIT:-3000}
      STUDENT_HOURLY_AI_LIMIT: ${STUDENT_HOURLY_AI_LIMIT:-40}
      SCHOOL_DAILY_AI_LIMIT: ${SCHOOL_DAILY_AI_LIMIT:-6000}
      TUTOR_DAILY_AI_LIMIT: ${TUTOR_DAILY_AI_LIMIT:-1500}
      API_PORT: "3000"
      AI_GATEWAY_URL: http://ai-gateway:8000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-gateway:
        condition: service_started

  # ─── Next.js Web Frontend ───────────────────────────────────────────────── #
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    container_name: edusocrates-web
    ports:
      - "3001:3001"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api/v1
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
      NEXT_PUBLIC_ENABLE_DEMO: ${NEXT_PUBLIC_ENABLE_DEMO:-false}
      PORT: "3001"
    depends_on:
      - api-gateway

volumes:
  postgres_data:
